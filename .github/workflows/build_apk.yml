name: Build Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Export Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare RailOne.apk
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/RailOne.apk
          echo "=== APK Built Successfully ==="
          ls -lh release-output/RailOne.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RailOne-Release-APK
          path: release-output/RailOne.apk
          retention-days: 30

      - name: Publish GitHub Release (if tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/RailOne.apk
          name: RailOne Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
