name: rail_one
description: "RailOne - Official Indian Railways Mobile Application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  local_auth: any
  shared_preferences: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: FontAwesomeBrands
      fonts:
        - asset: assets/fonts/Font-Awesome-7-Brands-Regular-400.otf
          weight: 400
    - family: FontAwesomeRegular
      fonts:
        - asset: assets/fonts/Font-Awesome-7-Free-Regular-400.otf
          weight: 400
    - family: FontAwesomeSolid
      fonts:
        - asset: assets/fonts/Font-Awesome-7-Free-Solid-900.otf
          weight: 900
    - family: DIN-Condensed-Bold
      fonts:
        - asset: assets/fonts/DIN-Condensed-Bold.ttf
    - family: DINCondensed
      fonts:
        - asset: assets/fonts/DIN-Condensed-Bold.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/Railone.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/Railone.png"
